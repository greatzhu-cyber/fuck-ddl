[package]
name = "fuck-ddl"
version = "0.2.0"
description = "Deadline-first work recorder for Windows"
authors = ["Fuck DDL contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fuck_ddl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
rand = "0.9"
url = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
